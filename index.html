<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Placement Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 22rem;">
        <h4 class="text-center mb-3">🎓 Placement Predictor</h4>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">CGPA</label>
                <input type="number" step="0.01" name="cgpa" class="form-control" placeholder="e.g. 7.8" required>
            </div>

            <div class="mb-3">
                <label class="form-label">IQ</label>
                <input type="number" name="iq" class="form-control" placeholder="e.g. 120" required>
            </div>

            <button class="btn btn-primary w-100">Predict</button>
        </form>

        {% if result %}
            <div class="alert alert-info text-center mt-3">
                Result: <strong>{{ result }}</strong>
            </div>
        {% endif %}
    </div>
</div>

</body>
</html>
